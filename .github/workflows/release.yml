# CD：打 tag 即出包并发布到 GitHub Release
#
# 触发：push tag `v*`（或手动 workflow_dispatch 指定 tag）
#
# 三步：
#   1. guard  —— 版本号 / 发布说明 / 提交已进 master，三者不齐直接失败（省掉白构建）
#   2. build  —— 注入正式签名 keystore → `flutter build apk --release --split-per-abi`
#                → 每个包跑 `tool/release_preflight.py`（含签名指纹比对）→ 传 artifact
#   3. publish —— `gh release create`，上传三个 APK + SHA256SUMS，正文用 docs/release-notes-<tag>.md
#
# ── 一次性配置（仓库 Settings → Secrets and variables → Actions）────────────
#   ANDROID_KEYSTORE_BASE64   正式签名 keystore 的 base64（`tool/keystore_to_base64.ps1` 生成）
#   ANDROID_KEYSTORE_PASSWORD keystore 口令（即本地 key.properties 的 storePassword）
#   ANDROID_KEY_PASSWORD      私钥口令（keyPassword）
#   ANDROID_KEY_ALIAS         别名（本仓库是 `upload`）
#
# 指纹不需要单独配 secret：`tool/release_preflight.py` 里写死了 upload key 的 SHA-256
# （与 v0.7.16 起同一把），签名不对它会直接 FAIL —— 这就是「注入错了 keystore」的兜底。
#
# ⚠️ 这些 secret 一旦泄露 = 别人能签出可覆盖安装你 App 的包。不要写进任何文件、不要贴聊天。
#
# ── 为什么不用 `flutter build` 隐式 pub get ────────────────────────────────
# 出正式包必须保证插件注册表（.flutter-plugins-dependencies）在 —— v0.8.3 首包白屏就是
# `--no-pub` + 缺这个文件导致的。所以这里显式 `flutter pub get` 之后再用 `--no-pub` 构建。

name: CD · tag → Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在于 master，如 v0.8.7）'
        required: true
        type: string
      dry_run:
        description: '只构建+校验，不创建 Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  # ─────────────────────────── 1. 前置校验 ───────────────────────────
  guard:
    name: guard · 版本 / 说明 / 提交
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史判断「这个提交在不在 master 上」

      - id: vars
        name: 解析 tag 并比对 pubspec 版本
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # ⚠️ **先写 output 再做校验**：下面的校验若失败，notify job 仍要能拿到 tag
          # （否则 issue 标题会退化成 refs/heads/master —— 2026-11-13 实测踩到）
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag 形态不对：$TAG（应形如 v0.8.7）"; exit 1; }

          # tag 必须指向一个「已经在 master 上」的提交 —— 防止在未合并的分支上打 tag 发布
          # （checkout 的 fetch-depth: 0 通常已带 tag，但不保证：显式再拉一次）
          git fetch --quiet --tags --force origin master +refs/tags/*:refs/tags/*
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/master; then
            echo "::error::$TAG 指向的提交不在 master 上，拒绝发布"
            exit 1
          fi

          # pubspec 的 versionName 必须等于 tag（去掉 v），否则包里版本和 Release 对不上
          PUB_VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9.]*\)+[0-9]*.*/\1/p' pubspec.yaml | head -1)"
          if [[ "$PUB_VERSION" != "${TAG#v}" ]]; then
            echo "::error::pubspec.yaml 是 $PUB_VERSION，tag 是 ${TAG#v} —— 先改版本号并合到 master 再打 tag"
            exit 1
          fi

          # 发布说明必须存在（Release 正文直接引用它）
          NOTES="docs/release-notes-$TAG.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::缺少 $NOTES —— 发布说明要和代码一起进 master"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PUB_VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ $TAG / pubspec $PUB_VERSION / 说明 $NOTES"

  # ─────────────────────────── 2. 出包 ───────────────────────────
  build:
    name: build · 三 ABI 正式包
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36 + CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" > /dev/null
          else
            echo "::warning::找不到 sdkmanager，跳过补装（依赖 runner 预装）"
          fi

      - name: 注入正式签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?缺少 secret ANDROID_KEYSTORE_BASE64 —— 没有它只能出 debug 签名的包，不允许发布}"
          : "${STORE_PASS:?缺少 secret ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_PASS:?缺少 secret ANDROID_KEY_PASSWORD}"
          : "${KEY_ALIAS:?缺少 secret ANDROID_KEY_ALIAS}"

          KEYSTORE="$GITHUB_WORKSPACE/android/upload-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          # storeFile 用绝对路径：build.gradle.kts 里是 file(it)，相对路径会按 app/ 解析
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          EOF
          chmod 600 android/key.properties
          echo "✓ keystore 与 key.properties 就位（$(du -h "$KEYSTORE" | cut -f1)）"

      - name: Lower Gradle heap for runner
        run: sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx3G -XX:MaxMetaspaceSize=1G/' android/gradle.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: 发布闸门（每个 ABI 都过 preflight，签名指纹自动比对）
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$APK_DIR/app-$abi-release.apk"
            [[ -f "$apk" ]] || { echo "::error::缺少 $apk"; exit 1; }
            echo "── $abi ──"
            python3 tool/release_preflight.py --apk "$apk"
          done

      - name: 重命名 + 校验和 + 验证说明
        id: pack
        run: |
          set -euo pipefail
          TAG="${{ needs.guard.outputs.tag }}"
          VERSION="${{ needs.guard.outputs.version }}"
          OUT=dist && mkdir -p "$OUT"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "$OUT/yanxin-$TAG-$abi-release.apk"
          done
          (cd "$OUT" && sha256sum ./*.apk > SHA256SUMS.txt)
          cat "$OUT/SHA256SUMS.txt"

          # 签名指纹：拿 arm64 那个包问 apksigner（三包同一签名）
          APK_ARM64="$OUT/yanxin-$TAG-arm64-v8a-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-/nonexistent}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1 || true)"
          CERT_SHA=""
          if [ -n "${APKSIGNER:-}" ] && [ -x "$APKSIGNER" ]; then
            # 注意：解析用「找 SHA-256 digest 这一行 + 取最后一个字段」的写法，
            # 不写死 "Signer #1 ... " 前缀 —— 不同 build-tools 版本的措辞/前缀会变，
            # 写死过一次，CI 上直接取到空串（VERIFY.md 里就是空的）。
            CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK_ARM64" 2>/dev/null \
              | grep -oiE 'SHA-256 digest:[[:space:]]*[0-9a-f]+' | head -1 \
              | awk '{print tolower($NF)}' || true)"
          fi
          if [ -z "$CERT_SHA" ]; then
            # 回退：preflight 里写死的 upload key 指纹（它同时也是发布闸门的判据）
            CERT_SHA="$(grep -oE '[0-9a-f]{64}' tool/release_preflight.py | head -1 || true)"
            echo "::warning::apksigner 没能读出指纹，用 release_preflight.py 里的 expected 值兜底"
          fi
          if [ -z "$CERT_SHA" ]; then
            echo "::error::连兜底指纹都取不到，VERIFY.md 会缺关键信息"; exit 1
          fi
          echo "cert sha256 = $CERT_SHA (apksigner=${APKSIGNER:-未找到})"

          # 逐包版本码（4000+ / 3000+ / 6000+ 的 ABI 偏移，方便用户核对）
          cat > "$OUT/VERIFY.md" <<VERIFY
          # 校验与安装（$TAG）

          本页所有哈希都由 CI 在**构建机上**生成，与仓库里的源码一一对应。

          ## 1. 校验下载是否完整

          \`\`\`bash
          # Linux / macOS（在 APK 与 SHA256SUMS.txt 同一个目录）
          sha256sum -c SHA256SUMS.txt

          # Windows（PowerShell）
          Get-FileHash .\yanxin-$TAG-arm64-v8a-release.apk -Algorithm SHA256
          # 与下面表格里的值逐字比对
          \`\`\`

          | 包 | SHA-256 |
          |---|---|
          $(cd "$OUT" && sha256sum ./*.apk | sed 's|\./||' | awk '{printf "| `%s` | `%s` |\n", $2, $1}')

          ## 2. 校验签名是不是"同一把钥匙"

          三个包都用同一把 upload key 签名（自 $TAG 起沿用，未更换）：

          \`\`\`
          证书 SHA-256：$CERT_SHA
          证书主体    ：CN=yanxin
          \`\`\`

          手机上装过的旧版本能直接覆盖安装 = 签名一致。想用工具核对：

          \`\`\`bash
          # 需要 Android SDK build-tools
          apksigner verify --print-certs yanxin-$TAG-arm64-v8a-release.apk
          \`\`\`

          \`\`\`powershell
          # 没有 SDK？看 APK 内 META-INF/*.RSA 的证书指纹也行
          # 或用 Android Studio 的 Build > Analyze APK
          \`\`\`

          ## 3. 装哪个

          | 你的手机 | 下哪个 |
          |---|---|
          | 近几年任意 Android（arm64） | \`yanxin-$TAG-arm64-v8a-release.apk\` |
          | 很老的 32 位机器 | \`yanxin-$TAG-armeabi-v7a-release.apk\` |
          | 模拟器 / x86 平板 | \`yanxin-$TAG-x86_64-release.apk\` |

          版本名 **$VERSION**；同一版本三个包的 versionCode 分别带 ABI 偏移（4000+/3000+/6000+），
          升级时系统只认 versionCode 变大，**装错 ABI 会提示"应用未安装"**，换对应包即可。

          ## 4. 这个包是不是官方构建

          - 构建日志：GitHub Actions 的 \`CD · tag → Release\` 运行记录（每次发布都有，可复现）；
          - 源码：本仓库对应 tag \`$TAG\` 的提交；
          - 校验和 / 签名指纹如上 —— **任何一项对不上就别装**。
          VERIFY

          ls -lh "$OUT"
          echo "--- VERIFY.md 前 12 行 ---"
          head -12 "$OUT/VERIFY.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # ─────────────────────────── 3. 发布 ───────────────────────────
  publish:
    name: publish · GitHub Release
    needs: [guard, build]
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 建 Release + 传资产必须
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="docs/release-notes-$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 覆盖上传资产"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$(head -1 "$NOTES" | sed 's/^# //')" \
              --notes-file "$NOTES" \
              dist/*
          fi

      - name: 回读校验
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          echo "### $TAG 资产" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "- `\(.name)` — \(.size) B"' >> "$GITHUB_STEP_SUMMARY"
          COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          [[ "$COUNT" -ge 5 ]] || { echo "::error::资产数 $COUNT < 5（三个 APK + SHA256SUMS + VERIFY.md）"; exit 1; }
          echo "✓ $TAG 发布完成，共 $COUNT 个资产"

      - name: 关掉历史的失败 issue
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.guard.outputs.tag }}';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'release-failure', per_page: 50,
            });
            for (const issue of open.data) {
              if (!issue.title.includes(tag)) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ 后续发布成功：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n已自动关闭。`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }

  # ─────────────────────────── 4. 失败通知 ───────────────────────────
  # 发布失败时自动开一个 issue（同一 tag 反复失败就追加评论，不刷屏），
  # 成功发布时由 publish job 自动关掉。不需要任何第三方服务，只用仓库自带能力。
  notify:
    name: notify · 失败通知
    needs: [guard, build, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const inputTag = '${{ github.event.inputs.tag }}';
            const fallbackTag = context.ref.replace('refs/tags/', '').replace('refs/heads/', '');
            const tag = '${{ needs.guard.outputs.tag }}' || inputTag || fallbackTag || 'unknown';
            const dry = context.eventName === 'workflow_dispatch' && '${{ github.event.inputs.dry_run }}' === 'true';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // 哪个 job 红的（guard / build / publish）
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const failed = jobs.data.jobs
              .filter(j => j.conclusion === 'failure')
              .map(j => `- \`${j.name}\`（[日志](${j.html_url})）`)
              .join('\n') || '- （没有失败 job？看运行页）';

            const hints = [
              '| 症状 | 大概率原因 |',
              '|---|---|',
              '| `缺少 secret ANDROID_KEYSTORE_*` | 签名 secret 没配齐 / 名字打错（全大写+下划线） |',
              '| `tag 指向的提交不在 master 上` | 在未合并分支打了 tag |',
              '| `pubspec.yaml 是 X，tag 是 Y` | 版本号没跟着 tag 改 |',
              '| `缺少 docs/release-notes-<tag>.md` | 发布说明没进 master |',
              '| `签名指纹不一致` | secret 里的 keystore 不是那把 upload key |',
              '| `preflight` FAIL | 插件注册表缺失 / 核心 .so 缺失（先看是不是漏了 `flutter pub get`） |',
            ].join('\n');

            const body = [
              `**${dry ? '演练（dry_run）' : '发布'}失败**：\`${tag}\``,
              '',
              `运行记录：${runUrl}`,
              `触发方式：${context.eventName}${dry ? '（dry_run）' : ''}`,
              '',
              '### 失败的 job',
              failed,
              '',
              '### 常见原因',
              hints,
              '',
              '_构建 artifact 已保留 90 天，可在运行页下载排查，不必重跑。_',
              '_这条 issue 会在下一次同 tag 发布成功时自动关闭。_',
            ].join('\n');

            // label 不存在就建一个
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'release-failure' });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: 'release-failure', color: 'B60205',
                description: 'CD 发布失败（自动创建）',
              });
            }

            const title = `[CD] ${dry ? '演练' : '发布'}失败：${tag}`;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'release-failure', per_page: 50,
            });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({ owner, repo, issue_number: hit.number, body });
              core.info(`已追加评论到 issue #${hit.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: ['release-failure'],
              });
              core.info(`已创建 issue #${created.data.number}`);
            }

            await core.summary
              .addHeading(`CD ${dry ? '演练' : '发布'}失败：${tag}`, 3)
              .addRaw(failed, true)
              .addLink('运行记录', runUrl)
              .write();

name: CI

# ── 门禁清单（与本地一致：`fx-qa` = analyze + test）─────────────────────────
#
#   static : 生成物同步（build_runner 后 git diff 必须为空）+ flutter analyze
#   test   : flutter test（CI 上允许默认并发；**本机**必须 --concurrency=1，见 HANDOFF）
#   build  : flutter build apk --debug —— 证明「能打包」，analyze/test 证明不了 Gradle /
#            Manifest / Kotlin / ML Kit 依赖链没坏
#   release: flutter build apk --release + tool/release_preflight.py —— 证明 **release 包里
#            真的带着插件与 native 库**（v0.8.3 首包就是「装得上但插件没注册 → 全站白屏」，
#            debug 包与本地 --no-pub 构建都测不出来）
#
# 四个 job 并行跑：一个有红都能单独定位，不用等前面的跑完。
#
# ── 为什么没有「格式门禁」─────────────────────────────────────────────────
# `dart format --set-exit-if-changed` 现在会报 149/223 个文件要改（历史代码没按 formatter
# 跑过）。直接加 = 每次 PR 必红。要加得先做一次「纯格式化」提交，再开门禁 —— 那是独立改动，
# 别混在功能 PR 里。
#
# ── 为什么没有 Dependabot / Renovate ──────────────────────────────────────
# 本项目依赖是**锁死**的（drift 2.31.0 / sqlite3 2.9.4 / jni_flutter 1.0.1 …，
# 升了 App 可能起不来）。自动提 PR 升版本与这条硬约束直接冲突。
#
# ── 分支保护（手动步骤，仓库设置里点一次即可）──────────────────────────────
# Settings → Branches → Require status checks：勾 `analyze · 生成物同步` / `test` /
# `build apk (debug)` / `release · 插件与版本物检`；再勾 Require a pull request before merging。
# ⚠️ 一旦勾了 required checks，就**不要**给本 workflow 加 paths-ignore —— 纯文档 PR 会因为
#    检查永远不报告而卡死（GitHub 的经典坑）。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消上一次 —— 只关心最新提交，省 runner 也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：只读代码；actions: write 是给依赖缓存上传用的（缺了缓存会静默不保存）
permissions:
  contents: read
  actions: write

jobs:
  static:
    name: analyze · 生成物同步
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter env
        uses: ./.github/actions/flutter-env

      - name: Regenerate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # database.g.dart 是入库的生成物（约 180 KB）。改了 tables.dart 却忘了重跑
      # build_runner，编译期不会报错、运行时才会出问题 —— 这里把它变成硬门禁。
      - name: Generated code is up to date
        run: |
          if ! git diff --exit-code -- 'lib/**/*.g.dart'; then
            echo "::error::lib/**/*.g.dart 与 tables.dart 不同步。请在本地执行"
            echo "::error::'dart run build_runner build --delete-conflicting-outputs' 并提交生成物。"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter env
        uses: ./.github/actions/flutter-env

      # 本机跑必须 --concurrency=1（内存不足会让 Dart VM OOM）；runner 上默认并发即可。
      - name: Test
        run: flutter test

  build:
    name: build apk (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter env
        uses: ./.github/actions/flutter-env

      - name: Set up Android build env
        uses: ./.github/actions/android-build-env

      # --no-pub：防止 flutter build 隐式跑 pub get 把 pubspec.lock 里的版本升上去
      # 只打 arm64：release 本来就只有 ARM，x86_64 只是给模拟器用（本机装包时再验），
      # 这样这一跳能稳在 10 分钟内。
      - name: Build debug APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64

  release:
    name: release · 插件与版本物检
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter env
        uses: ./.github/actions/flutter-env

      - name: Set up Android build env
        uses: ./.github/actions/android-build-env

      # flutter-env 已经跑过 pub get；这里用 --no-pub 避免同一 job 内再跑一次。
      # 白屏根因是「缺 .flutter-plugins-dependencies」，所以单独断言它在。
      - name: Verify plugin registry
        run: test -s .flutter-plugins-dependencies

      - name: Build release APK (arm64)
        run: flutter build apk --release --no-pub --target-platform android-arm64

      # CI 没有 keystore（key.properties 不入库），release 会退化成 debug 签名，
      # 所以跳过指纹比对；本地出正式包时不要加 --skip-signature。
      - name: Release preflight
        run: |
          python3 tool/release_preflight.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --skip-signature
